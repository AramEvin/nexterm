[package]
name = "nexterm"
version = "0.6.1"
description = "NexTerm - open-source, security-focused SSH/SFTP client"
authors = ["NexTerm contributors"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "nexterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
russh-sftp = "3"
sha2 = "0.10"
base64 = "0.21"
suppaftp = { version = "12", default-features = false, features = ["tokio-rustls-ring"] }
rustls-webpki-roots = { package = "webpki-roots", version = "1" }
secrecy = { version = "0.10", features = ["serde"] }
zeroize = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.42", features = ["bundled"] }
argon2 = "0.6"
chacha20poly1305 = "0.11"
tauri-plugin-dialog = "2"
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

# Size/perf guideline: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The vault's Argon2id (64 MiB) is very slow unoptimised; compile the crypto
# crates with optimisations even in dev/test builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
