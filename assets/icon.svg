<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a3a"/>
      <stop offset="1" stop-color="#0b1219"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#bg)"/>
  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#shine)"/>
  <rect x="50" y="50" width="924" height="924" rx="206" fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-width="6"/>
  <!-- window dots -->
  <circle cx="200" cy="200" r="30" fill="#ff6b6b" fill-opacity="0.9"/>
  <circle cx="290" cy="200" r="30" fill="#fbbf24" fill-opacity="0.9"/>
  <circle cx="380" cy="200" r="30" fill="#34d399" fill-opacity="0.9"/>
  <!-- prompt chevron -->
  <path d="M250 400 L470 560 L250 720" fill="none" stroke="url(#accent)" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor -->
  <rect x="540" y="664" width="250" height="88" rx="44" fill="#e6fffb"/>
</svg>
