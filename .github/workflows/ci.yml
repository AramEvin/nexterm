name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN; jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to full commit SHAs (comment = version);
# Dependabot keeps them up to date.
jobs:
  build:
    name: Lint, test, audit, build (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install npm dependencies (from lockfile)
        run: npm ci

      # ---- Frontend ---------------------------------------------------------
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Frontend unit tests (Vitest)
        run: npm test
      - name: Build frontend
        # Needed before any cargo step: tauri::generate_context! embeds ../dist.
        run: npm run build

      # ---- Rust -------------------------------------------------------------
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test (unit)
        working-directory: src-tauri
        run: cargo test --locked

      # ---- Supply chain -----------------------------------------------------
      - name: Install cargo-audit
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
      - name: npm audit (shipped dependencies, moderate+)
        run: npm audit --omit=dev --audit-level=moderate
      - name: npm audit (dev tooling, high+)
        run: npm audit --audit-level=high

      # ---- Package ----------------------------------------------------------
      - name: Build installers (MSI + NSIS, unsigned)
        run: npx tauri build

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexterm-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  integration:
    name: Integration tests (OpenSSH, SFTP, FTP/FTPS)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      sshd:
        image: lscr.io/linuxserver/openssh-server:latest
        ports: ["2222:2222"]
        env:
          USER_NAME: ntest
          USER_PASSWORD: Test-Pass-123 # throw-away test container only
          PASSWORD_ACCESS: "true"
          # Public half of the test-only key in src-tauri/tests/fixtures.
          PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICx6sXLiohIuTTar0Cgnsgda8/YG1XYt547ikog84PJG nexterm-test-only"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux build dependencies (+ ssh-agent for the agent test)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev openssh-client
      - run: npm ci && npm run build

      - name: Wait for sshd
        run: for i in $(seq 1 30); do nc -z 127.0.0.1 2222 && exit 0; sleep 2; done; exit 1
      - name: SSH and SFTP integration tests
        working-directory: src-tauri
        env:
          NEXTERM_TEST_SSH_HOST: 127.0.0.1
          NEXTERM_TEST_SSH_PORT: "2222"
          NEXTERM_TEST_SSH_USER: ntest
          NEXTERM_TEST_SSH_PASSWORD: Test-Pass-123
        run: |
          cargo test --locked --test ssh_integration -- --ignored --test-threads=1
          cargo test --locked --test sftp_integration -- --ignored --test-threads=1

      - name: Start FTP and FTPS test servers
        run: |
          python -m pip install --disable-pip-version-check pyftpdlib pyopenssl
          mkdir -p /tmp/ftp /tmp/ftps /tmp/ftpcert
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=localhost" \
            -keyout /tmp/ftpcert/key.pem -out /tmp/ftpcert/cert.pem
          nohup python scripts/test-ftp-server.py 2121 /tmp/ftp plain > /tmp/ftp.log 2>&1 &
          nohup python scripts/test-ftp-server.py 2990 /tmp/ftps tls /tmp/ftpcert/cert.pem /tmp/ftpcert/key.pem > /tmp/ftps.log 2>&1 &
          echo "NEXTERM_TEST_FTPS_FINGERPRINT=SHA256:$(openssl x509 -in /tmp/ftpcert/cert.pem -outform DER | openssl dgst -sha256 -binary | base64 | tr -d '=')" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do nc -z 127.0.0.1 2121 && nc -z 127.0.0.1 2990 && exit 0; sleep 1; done
          cat /tmp/ftp.log /tmp/ftps.log; exit 1
      - name: FTP and FTPS integration tests
        working-directory: src-tauri
        env:
          NEXTERM_TEST_FTP_PORT: "2121"
          NEXTERM_TEST_FTPS_PORT: "2990"
          NEXTERM_TEST_FTP_USER: ftest
          NEXTERM_TEST_FTP_PASSWORD: Ftp-Pass-123 # throw-away local test server only
        run: cargo test --locked --test ftp_integration -- --ignored --test-threads=1
