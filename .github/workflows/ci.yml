name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Lint, test, audit, build (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies (from lockfile)
        run: npm ci

      # ---- Frontend checks --------------------------------------------------
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Frontend unit tests
        run: npm test
      - name: Build frontend
        # Needed before any cargo step: tauri::generate_context! embeds ../dist.
        run: npm run build

      # ---- Rust checks ------------------------------------------------------
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      # ---- Supply chain -----------------------------------------------------
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
      - name: npm audit (shipped dependencies, moderate+)
        run: npm audit --omit=dev --audit-level=moderate
      - name: npm audit (dev tooling, high+)
        run: npm audit --audit-level=high

      # ---- Package ----------------------------------------------------------
      - name: Build installers (MSI + NSIS, unsigned)
        run: npx tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: nexterm-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  integration:
    name: SSH, SFTP and FTP integration tests (Linux, OpenSSH container, pyftpdlib)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      sshd:
        image: lscr.io/linuxserver/openssh-server:latest
        ports: ["2222:2222"]
        env:
          USER_NAME: ntest
          USER_PASSWORD: Test-Pass-123
          PASSWORD_ACCESS: "true"
          # Public half of the test-only key in src-tauri/tests/fixtures.
          PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICx6sXLiohIuTTar0Cgnsgda8/YG1XYt547ikog84PJG nexterm-test-only"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux build dependencies (+ ssh-agent for the agent test)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev openssh-client
      - run: npm ci && npm run build
      - name: Wait for sshd
        run: for i in $(seq 1 30); do nc -z 127.0.0.1 2222 && exit 0; sleep 2; done; exit 1
      - name: Run integration tests
        working-directory: src-tauri
        env:
          NEXTERM_TEST_SSH_HOST: 127.0.0.1
          NEXTERM_TEST_SSH_PORT: "2222"
          NEXTERM_TEST_SSH_USER: ntest
          NEXTERM_TEST_SSH_PASSWORD: Test-Pass-123
        run: |
          cargo test --locked --test ssh_integration -- --ignored --test-threads=1
          cargo test --locked --test sftp_integration -- --ignored --test-threads=1
      - name: Start FTP and FTPS test servers
        run: |
          pip install pyftpdlib pyopenssl
          mkdir -p /tmp/ftp /tmp/ftps /tmp/ftpcert
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=localhost" \
            -keyout /tmp/ftpcert/key.pem -out /tmp/ftpcert/cert.pem
          python3 scripts/test-ftp-server.py 2121 /tmp/ftp plain &
          python3 scripts/test-ftp-server.py 2990 /tmp/ftps tls /tmp/ftpcert/cert.pem /tmp/ftpcert/key.pem &
          echo "NEXTERM_TEST_FTPS_FINGERPRINT=SHA256:$(openssl x509 -in /tmp/ftpcert/cert.pem -outform DER | openssl dgst -sha256 -binary | base64 | tr -d '=')" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do nc -z 127.0.0.1 2121 && nc -z 127.0.0.1 2990 && exit 0; sleep 1; done; exit 1
      - name: Run FTP integration tests
        working-directory: src-tauri
        env:
          NEXTERM_TEST_FTP_PORT: "2121"
          NEXTERM_TEST_FTPS_PORT: "2990"
          NEXTERM_TEST_FTP_USER: ftest
          NEXTERM_TEST_FTP_PASSWORD: Ftp-Pass-123
        run: cargo test --locked --test ftp_integration -- --ignored --test-threads=1
