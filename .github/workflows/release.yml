name: Release

# Builds the Windows installers on GitHub and publishes them as a release with
# checksums and signed build provenance
# (https://docs.github.com/actions/security-guides/using-artifact-attestations).
# Start it either way:
#   - push a version tag: `git tag v0.7.0 && git push origin v0.7.0`, or
#   - Actions → Release → Run workflow → enter the version (the tag is created on
#     the selected branch's latest commit).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (must match package.json), e.g. 0.6.1"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Tag being released: the pushed tag, or v<input> for a manual run.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  build:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches the app version
        run: |
          tag="${RELEASE_TAG#v}"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version '$tag'"; exit 1
          fi
          for v in "$(node -p "require('./package.json').version")" \
                   "$(node -p "require('./src-tauri/tauri.conf.json').version")" \
                   "$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)"; do
            if [ "$v" != "$tag" ]; then echo "::error::Tag v$tag does not match version $v"; exit 1; fi
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0 # keep in sync with src-tauri/rust-toolchain.toml

      # No build cache in release builds (cache poisoning can't reach a release).
      - run: npm ci
      - name: Build installers (MSI + NSIS)
        run: npx tauri build

      - name: Collect files and checksums
        run: |
          mkdir dist-release
          cp src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi dist-release/
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist-release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-release/*.exe
            dist-release/*.msi

      - name: Release notes from CHANGELOG.md
        run: |
          version="${RELEASE_TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "---"
            echo "**Install:** download \`NexTerm_${version}_x64-setup.exe\`. The installer is not code-signed yet:"
            echo "Windows SmartScreen will warn, choose *More info → Run anyway*."
            echo
            echo "**Verify:** compare with \`SHA256SUMS.txt\`, or check the build provenance:"
            echo "\`gh attestation verify NexTerm_${version}_x64-setup.exe --repo ${GITHUB_REPOSITORY}\`"
          } >> notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          prerelease=""
          case "$version" in 0.*|*-*) prerelease="--prerelease" ;; esac
          # A manual run creates the tag on the commit that was built.
          gh release create "$RELEASE_TAG" dist-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "NexTerm $version" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" $prerelease
