name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: Check the [roadmap](https://github.com/AramEvin/nexterm/blob/main/docs/ROADMAP.md) first; your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should NexTerm behave? Mock-ups and examples from other tools help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Does this touch credentials, servers' trust, or files on your PC?
